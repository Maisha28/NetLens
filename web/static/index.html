<!doctype html>

    <symbol id="i-feed" viewBox="0 0 24 24"><polyline points="3 12 7 12 10 4 14 20 17 12 21 12"/></symbol>
    <symbol id="i-flows" viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></symbol>

    <symbol id="i-pipeline" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.2 6h9.6M6.4 8l4.6 8M17.6 8l-4.6 8"/></symbol>

    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="27" fill="none" stroke="url(#lg)" stroke-width="5"/>
        <circle cx="32" cy="32" r="17" fill="none" stroke="url(#lg)" stroke-width="2" opacity=".55"/>
        <circle cx="32" cy="32" r="7" fill="url(#lg)"/>
        <circle cx="50" cy="18" r="3.4" fill="#ffb454"/>
        <circle cx="14" cy="42" r="2.6" fill="#a78bfa"/>
        <circle cx="46" cy="49" r="2.2" fill="#3ee6c4"/>
      </svg>
      <div><b>NetLens</b><small>Network monitor</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot">
      NetLens never reads message content - only who talks to whom, how much, and when.
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Overview</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div id="sourceBadge"></div>
      
      <label class="switch on" id="guideSwitch" title="Show or hide the short explanation at the top of each page"><i></i>Help text</label>
      <button class="btn small" id="btnPause"><svg><use href="#i-pause"/></svg><span>Pause</span></button>
      <button class="btn small" id="btnSource"><svg><use href="#i-plug"/></svg>Source</button>
      <button class="btn small" id="btnReport" title="Download alerts, signed ledger and findings as JSON"><svg><use href="#i-download"/></svg>Report</button>
    </header>
    <div id="bannerSlot" style="padding:0 24px"></div>
    <main class="view" id="view"></main>
  </section>
</div>
